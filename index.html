<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I'm Sorry</title>

<style>
body {
    font-family: "Comic Sans MS", cursive;
    text-align: center;
    background: linear-gradient(45deg, pink, hotpink, #ffccff);
    color: #ff1493;
    overflow-x: hidden;
}

#celebrationPage { display: none; }

textarea {
    width: 60%;
    padding: 10px;
    border-radius: 15px;
    border: 2px solid hotpink;
    margin: 5px;
}

#paragraphDisplay {
    margin: 20px auto;
    padding: 15px;
    background: white;
    border-radius: 20px;
    width: 60%;
    box-shadow: 0 0 15px hotpink;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border-radius: 20px;
    border: none;
    background: hotpink;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

img {
    width: 180px;
    margin: 10px;
    border-radius: 20px;
}

.bounce {
    animation: bounce 1.5s infinite alternate;
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-20px); }
}

/* floating stars */
.star {
    position: fixed;
    bottom: -50px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
}

@keyframes floatUp {
    100% { transform: translateY(-800px); opacity: 0; }
}

.sparkle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    animation: sparkle 2s infinite;
}

@keyframes sparkle {
    50% { opacity: 1; }
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}

/* hide music player */
#musicPlayer {
    display: none;
}
</style>
</head>

<body>

<div id="mainPage">

<h1>I'm Really Sorry</h1>

<!-- FIXED HELLO KITTY IMAGE -->
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Hello_Kitty.png">

<br>

<p>Jackie,</p>

<textarea id="textInput" rows="4">
Hey I’m sorry for last night, if I did something to upset you I feel bad. I know I might be overreacting but I still feel bad if I made you upset. I’d rather overreact and apologize than not apologize. I hope you accept my apology if I did make you upset.
</textarea><br>

<button onclick="displayText()">Show Message</button>

<div id="paragraphDisplay"></div>

<!-- AUDIO -->
<iframe id="musicPlayer"
src="https://www.youtube.com/embed/Ayp-tWME32s?enablejsapi=1"
allow="autoplay">
</iframe>

<button onclick="playMusic()">Play Song 🎵</button>

<h2>Do you accept my apology?</h2>

<button onclick="yesClicked()">Yes</button>
<button id="noBtn" onmouseover="moveButton()">No</button>

</div>

<div id="celebrationPage">

<h1>YAY</h1>
<p id="customMessage"></p>

<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Hello_Kitty.png">

<br><br>

<img src="funny1.jpg" class="bounce">
<img src="funny2.jpg" class="bounce">
<img src="funny3.jpg" class="bounce">
<img src="funny4.jpg" class="bounce">

</div>

<canvas id="confetti"></canvas>

<script>
let personName = "Jackie";

function displayText() {
    let text = document.getElementById("textInput").value;
    document.getElementById("paragraphDisplay").innerText =
        personName + ", " + text;
}

function playMusic() {
    let player = document.getElementById("musicPlayer");
    player.src = "https://www.youtube.com/embed/Ayp-tWME32s?autoplay=1";
}

function yesClicked() {
    document.getElementById("mainPage").style.display = "none";
    document.getElementById("celebrationPage").style.display = "block";

    document.getElementById("customMessage").innerText =
        personName + " accepted the apology";

    startConfetti();
}

function moveButton() {
    let btn = document.getElementById("noBtn");
    btn.style.position = "absolute";
    btn.style.left = Math.random() * window.innerWidth + "px";
    btn.style.top = Math.random() * window.innerHeight + "px";
}

/* floating stars */
setInterval(() => {
    let star = document.createElement("div");
    star.className = "star";
    star.innerHTML = "✦";
    star.style.left = Math.random() * window.innerWidth + "px";
    star.style.fontSize = (Math.random() * 10 + 14) + "px";
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 6000);
}, 400);

/* sparkles */
setInterval(() => {
    let s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.top = Math.random() * window.innerHeight + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2000);
}, 200);

function startConfetti() {
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let confetti = [];

    for (let i = 0; i < 150; i++) {
        confetti.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 6 + 2,
            d: Math.random() * 50
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.beginPath();

        confetti.forEach(c => {
            ctx.moveTo(c.x, c.y);
            ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        });

        ctx.fill();

        confetti.forEach(c => {
            c.y += Math.cos(c.d) + 1;
            if (c.y > canvas.height) {
                c.y = 0;
                c.x = Math.random() * canvas.width;
            }
        });
    }

    setInterval(draw, 20);
}
</script>

</body>
</html>
